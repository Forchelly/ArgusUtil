[package]
name = "argus-util"
version = "0.1.0"
description = "Cross-platform port process manager"
authors = ["you"]
edition = "2021"

[lib]
name = "argus_util_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
ssh2 = "0.9"
netstat2 = "0.11"
sysinfo = "0.33"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
